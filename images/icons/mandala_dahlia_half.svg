<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="667" height="1200" viewBox="0 0 50 90" stroke="#eadfd9" stroke-width="0.4" stroke-linejoin="miter" stroke-miterlimit="10">
    <defs>

        <linearGradient id="fade-porcelain" gradientUnits="userSpaceOnUse" x1="0" y1="-44" x2="0" y2="0">
            <stop offset="0" stop-color="#eadfd9" stop-opacity="0"/>
            <stop offset="1" stop-color="#eadfd9" stop-opacity="1"/>
        </linearGradient>
        <linearGradient id="fade-blackberry" gradientUnits="userSpaceOnUse" x1="0" y1="-44" x2="0" y2="0">
            <stop offset="0" stop-color="#1f1d1d" stop-opacity="0.5"/>
            <stop offset="1" stop-color="#1f1d1d" stop-opacity="1"/>
        </linearGradient>
        <linearGradient id="fade-apricot" gradientUnits="userSpaceOnUse" x1="0" y1="-44" x2="0" y2="0">
            <stop offset="0" stop-color="#df9b57" stop-opacity="0.5"/>
            <stop offset="1" stop-color="#df9b57" stop-opacity="1"/>
        </linearGradient>
        <linearGradient id="fade-orchid" gradientUnits="userSpaceOnUse" x1="0" y1="-44" x2="0" y2="0">
            <stop offset="0" stop-color="#be508f" stop-opacity="0.5"/>
            <stop offset="1" stop-color="#be508f" stop-opacity="1"/>
        </linearGradient>
        <linearGradient id="fade-cobalt" gradientUnits="userSpaceOnUse" x1="0" y1="-44" x2="0" y2="0">
            <stop offset="0" stop-color="#3a4c97" stop-opacity="0.5"/>
            <stop offset="1" stop-color="#3a4c97" stop-opacity="1"/>
        </linearGradient>
        <g id="petal">
            <path d="M 0 -44 C 0 -44 -11.4 -33.6 -9.7 -19.1 C -8.5 -8.4 0 0 0 0 C 0 0 8.5 -8.4 9.7 -19.1 C 11.4 -33.6 0 -44 0 -44 Z" stroke-width="0.2"/>
            <path d="M 0 -44 L 0 0" fill="none" stroke-width="0.1"/>
        </g>
    </defs>
    <g transform="translate(0 45) rotate(90)">
        <use xlink:href="#petal" transform="rotate(-90)" fill="url(#fade-blackberry)"/>
        <use xlink:href="#petal" transform="rotate(-67.5)" fill="url(#fade-porcelain)"/>
        <use xlink:href="#petal" transform="rotate(-45)" fill="url(#fade-cobalt)"/>
