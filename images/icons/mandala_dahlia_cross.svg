<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="1200" viewBox="0 0 90 90" fill="none" stroke="#eadfd9" stroke-width="0.4" stroke-linejoin="miter" stroke-miterlimit="10">
    <defs>
        <!-- One petal, base at the center (0, 0), tip pointing up -->
        <g id="petal">
            <path d="M 0 -44 C 0 -44 -11.4 -33.6 -9.7 -19.1 C -8.5 -8.4 0 0 0 0 C 0 0 8.5 -8.4 9.7 -19.1 C 11.4 -33.6 0 -44 0 -44 Z" stroke-width="0.5"/>
            <path d="M 0 -44 L 0 0" fill="none" stroke-width="0.2"/>
        </g>
        <!-- A cross: four petals pointing up, right, down and left -->
        <g id="cross">
            <use xlink:href="#petal" fill="#eadfd9"/>
            <use xlink:href="#petal" transform="rotate(90)" fill="#be508f"/>
            <use xlink:href="#petal" transform="rotate(180)" fill="#3a4c97"/>
            <use xlink:href="#petal" transform="rotate(270)" fill="#df9b57"/>
        </g>
    </defs>
    <g transform="translate(45 45)">
        <!-- The cross, then three copies each turned a further 22.5°.
             Listed back to front: each cross is painted on top of the ones above it. -->
        <use xlink:href="#cross" transform="rotate(67.5)"  fill-opacity="0.5"/>
        <use xlink:href="#cross" transform="rotate(22.5)" />
        <use xlink:href="#cross" transform="rotate(45)" />
        <use xlink:href="#cross" />
    </g>
</svg>
